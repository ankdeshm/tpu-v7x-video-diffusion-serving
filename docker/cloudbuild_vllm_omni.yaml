steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '--network=cloudbuild'
  - '-f'
  - 'Dockerfile.vllm_omni'
  - '-t'
  - 'us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0'
  - '.'
images:
- 'us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0'
options:
  machineType: 'E2_HIGHCPU_32'
timeout: '1800s'
