apiVersion: batch/v1
kind: Job
metadata:
  name: v7x-16-flex-minimax-h3-serving
  namespace: default
  labels:
    app: v7x-16-flex-minimax-h3-serving
    workload: video-serving-priority-1
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 4
  parallelism: 4
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v7x-16-flex-minimax-h3-serving
        workload: video-serving-priority-1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: ank-tpu-v7x-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: minimax-h3-serve
        image: us-central1-docker.pkg.dev/diesel-patrol-382622/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0
          mount -o remount,size=850G /dev/shm || true
          rm -rf /dev/shm/DeepSeek* /dev/shm/Kimi* /dev/shm/GLM* /dev/shm/flint* /dev/shm/torchtitan* /dev/shm/LTX* /dev/shm/Wan* /dev/shm/outputs /dev/shm/smoke* /dev/shm/sglang_out_* /dev/shm/sglang_diffusion_cache /dev/shm/hf_cache /dev/shm/pd_* /dev/shm/psm_* /dev/shm/sem.loky* /workspace/core* || true
          df -h /dev/shm
          TOK=$(curl -sS -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsSL -H "Authorization: Bearer ${TOK}" \
            "https://storage.googleapis.com/storage/v1/b/ank-usc1-bucket-314837540096/o/video-serving-scripts%2Frun_v7x_minimax_h3_serving.py?alt=media" \
            -o /tmp/run_v7x_minimax_h3_serving.py
          exec python3 -u /tmp/run_v7x_minimax_h3_serving.py \
            --gcs-bucket=ank-usc1-bucket-314837540096 \
            --run-id=v7x_flex_minimax_h3_serve_p1_v2
        resources:
          requests:
            google.com/tpu: "4"
            memory: "700Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        hostPath:
          path: /dev/shm
          type: Directory
