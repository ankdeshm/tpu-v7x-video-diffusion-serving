apiVersion: batch/v1
kind: Job
metadata:
  name: v7x-16-flex-ltx25-serving
  namespace: default
  labels:
    app: v7x-16-flex-ltx25-serving
    workload: video-serving-priority-2
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 4
  parallelism: 4
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v7x-16-flex-ltx25-serving
        workload: video-serving-priority-2
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: ank-tpu-v7x-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ltx25-serve
        image: us-central1-docker.pkg.dev/diesel-patrol-382622/vllm/vllm-torchtpu-bench:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          mount -o remount,size=850G /dev/shm || true
          rm -rf /dev/shm/MiniMax-H3 /dev/shm/outputs /dev/shm/ltx25_outputs || true
          TOK=$(curl -sS -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsSL -H "Authorization: Bearer ${TOK}" \
            "https://storage.googleapis.com/storage/v1/b/ank-usc1-bucket-314837540096/o/video-serving-scripts%2Frun_v7x_ltx25_serving.py?alt=media" \
            -o /tmp/run_v7x_ltx25_serving.py
          exec python3 -u /tmp/run_v7x_ltx25_serving.py \
            --gcs-bucket=ank-usc1-bucket-314837540096 \
            --run-id=v7x_flex_ltx25_serve_p2
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        hostPath:
          path: /dev/shm
          type: Directory
