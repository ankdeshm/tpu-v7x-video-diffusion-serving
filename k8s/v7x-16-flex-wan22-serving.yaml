apiVersion: batch/v1
kind: Job
metadata:
  name: v7x-16-flex-wan22-serving
  namespace: default
  labels:
    app: v7x-16-flex-wan22-serving
    workload: video-serving-priority-3
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 4
  parallelism: 4
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v7x-16-flex-wan22-serving
        workload: video-serving-priority-3
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: wan22-serve
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=850G /dev/shm || true
          rm -rf /dev/shm/MiniMax-H3 /dev/shm/FastH3 /dev/shm/FastVideo /dev/shm/LTX-2.5 /dev/shm/LTX-2.5-Diffusers /dev/shm/hf_cache /dev/shm/sglang_xla_cache /dev/shm/sglang_diffusion_cache /dev/shm/ltx25_out_* /dev/shm/ltx25_outputs /dev/shm/wan_outputs /dev/shm/sglang_out_* /workspace/core* || true
          df -h /dev/shm
          TOK=$(curl -sS -H "Metadata-Flavor: Google" "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsSL -H "Authorization: Bearer ${TOK}" \
            "https://storage.googleapis.com/storage/v1/b/YOUR_GCS_BUCKET/o/video-serving-scripts%2Frun_v7x_wan22_serving.py?alt=media" \
            -o /tmp/run_v7x_wan22_serving.py
          exec python3 -u /tmp/run_v7x_wan22_serving.py \
            --gcs-bucket=YOUR_GCS_BUCKET \
            --run-id=v7x_flex_wan22_serve_p3
        resources:
          requests:
            google.com/tpu: "4"
            memory: "700Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        hostPath:
          path: /dev/shm
          type: Directory
